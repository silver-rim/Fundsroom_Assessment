# Static hosting for the SPA. The rules mirror frontend/vercel.json, so the
# container and the Vercel deployment behave the same way.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed filenames change whenever their contents do, so they can be cached
    # for a year. index.html must NOT be, or a redeploy is invisible until the
    # browser's cache expires.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The app uses BrowserRouter, so /customers/12 is a client-side route with
    # no file behind it. Without this fallback, refreshing that page — or
    # opening a shared link — returns nginx's 404 instead of the application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # The API sets its own security headers via helmet; these cover the static
    # files nginx serves directly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
