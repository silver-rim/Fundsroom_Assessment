# =============================================================================
# CI + deployment.
#
# The point of this workflow is the GATE: nothing reaches Render or Vercel
# unless the whole test suite passes first. Both platforms can deploy straight
# from a push on their own, and by default they do - which means a commit that
# breaks the build ships before anyone notices. Turning their auto-deploy off
# and letting this file drive the deploy is what makes the tests load-bearing
# rather than decorative. See docs/DEPLOYMENT.md for the one-time setup.
#
# Pull requests run the tests only. Deploys happen on main, and never for a PR
# from a fork - a fork cannot read the secrets anyway.
# =============================================================================

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The two halves deliberately run on different majors, because they are deployed
# to different places and CI should test what actually ships.
env:
  # The API runs on Node 20 on Render (NODE_VERSION there) and builds on
  # node:20-alpine in Docker. CI is not the place to discover that a newer
  # runtime behaves differently.
  BACKEND_NODE_VERSION: '20'
  # The SPA never touches Render - Vercel builds it, and it is developed on 22.
  # It must not drop to 20: `npm test` passes a glob to `node --test`, and glob
  # support landed in Node 22. On 20 the runner reads "src/**/*.test.ts" as a
  # literal filename and fails before running a single test.
  FRONTEND_NODE_VERSION: '22'

# A second push while a deploy is mid-flight should queue, not race it. Deploys
# are not cancelled in progress: a half-applied migration is worse than a wait.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # The integration suite talks to a real PostgreSQL server on purpose: row
    # locks, CHECK constraints and transactional rollback do not exist in a
    # mock, and those are the guarantees being tested.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_erp_crm
        ports:
          - 5432:5432
        # Without this the first test can connect before the server finishes
        # initialising, which fails in a way that looks like a flaky test.
        options: >-
          --health-cmd "pg_isready -U postgres -d mini_erp_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # scripts/test.mjs reads this, derives "mini_erp_crm_test" from it, and
      # refuses to run if that name is not distinct - the suite truncates every
      # table between files.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_erp_crm
      DATABASE_SSL: 'false'
      # Throwaway, and long enough to satisfy the 32-character minimum in
      # src/config/env.ts. It signs tokens that exist only inside this job.
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-github-actions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.BACKEND_NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` installs exactly what the lockfile pins. NODE_ENV is not set to
      # production here, so devDependencies - including typescript - come with
      # it. (Setting it is exactly what broke the first Render deploy.)
      - name: Install
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # The harness applies the migrations itself before the first test file.
      - name: Test
        working-directory: backend
        run: npm test

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      # `npm run build` type-checks and then builds, so this catches a bundle
      # that cannot be produced before Vercel discovers the same thing.
      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API (Render)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Mapped to env first: the secrets context is not reliably readable from a
    # step-level `if`, but env is.
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      # Render exposes a deploy hook per service: Settings -> Deploy Hook. It is
      # a secret URL, so it lives in repository secrets, never in this file.
      # Turn Render's own "Auto-Deploy" OFF, or the service deploys twice and
      # the ungated one wins the race.
      - name: Trigger Render deploy
        if: ${{ env.DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"

      - name: Skip notice
        if: ${{ env.DEPLOY_HOOK == '' }}
        run: echo "RENDER_DEPLOY_HOOK_URL is not set - skipping. Add it in Settings -> Secrets."

  # ---------------------------------------------------------------------------
  deploy-web:
    name: Deploy SPA (Vercel)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # VERCEL_ORG_ID / VERCEL_PROJECT_ID are read by the CLI directly, which is
    # what lets `vercel pull` link the project without an interactive prompt.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npm install --global vercel@latest

      # `vercel pull` fetches the project settings - including Root Directory
      # (frontend) and VITE_API_BASE_URL. That matters: VITE_* variables are
      # compiled into the bundle at build time, so the build must happen with
      # the production values already in hand.
      - name: Pull Vercel environment
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # --prebuilt uploads what was just built rather than rebuilding on
      # Vercel, so the artifact that ships is the one CI tested.
      - name: Deploy
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Skip notice
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "VERCEL_TOKEN is not set - skipping. Add it in Settings -> Secrets."
