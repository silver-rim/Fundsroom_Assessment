# =============================================================================
# CI, and the API deployment.
#
# Every push and pull request runs both test suites. On main, a green run then
# triggers the Render deploy - so a commit that breaks the API cannot reach
# production, which is what Render's own auto-deploy would happily allow. Turn
# that auto-deploy OFF in the Render dashboard, or the ungated path still
# exists and this gate is decorative.
#
# The SPA is deliberately NOT deployed here. Vercel's own Git integration
# already deploys it on push, and reproducing that through the CLI bought
# nothing but breakage. Its tests still run below on every push; they simply
# do not block that deploy. The frontend build also fails loudly on a type
# error, on Vercel exactly as it does here, so the exposure is small.
#
# Deploys never run for a pull request, including from a fork - a fork cannot
# read the secrets anyway.
# =============================================================================

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The two halves deliberately run on different majors, because they are deployed
# to different places and CI should test what actually ships.
env:
  # The API runs on Node 20 on Render (NODE_VERSION there) and builds on
  # node:20-alpine in Docker. CI is not the place to discover that a newer
  # runtime behaves differently.
  BACKEND_NODE_VERSION: '20'
  # The SPA never touches Render - Vercel builds it, and it is developed on 22.
  # It must not drop to 20: `npm test` passes a glob to `node --test`, and glob
  # support landed in Node 22. On 20 the runner reads "src/**/*.test.ts" as a
  # literal filename and fails before running a single test.
  FRONTEND_NODE_VERSION: '22'

# A second push while a deploy is mid-flight should queue, not race it. Deploys
# are not cancelled in progress: a half-applied migration is worse than a wait.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # The integration suite talks to a real PostgreSQL server on purpose: row
    # locks, CHECK constraints and transactional rollback do not exist in a
    # mock, and those are the guarantees being tested.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_erp_crm
        ports:
          - 5432:5432
        # Without this the first test can connect before the server finishes
        # initialising, which fails in a way that looks like a flaky test.
        options: >-
          --health-cmd "pg_isready -U postgres -d mini_erp_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # scripts/test.mjs reads this, derives "mini_erp_crm_test" from it, and
      # refuses to run if that name is not distinct - the suite truncates every
      # table between files.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_erp_crm
      DATABASE_SSL: 'false'
      # Throwaway, and long enough to satisfy the 32-character minimum in
      # src/config/env.ts. It signs tokens that exist only inside this job.
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-github-actions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.BACKEND_NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` installs exactly what the lockfile pins. NODE_ENV is not set to
      # production here, so devDependencies - including typescript - come with
      # it. (Setting it is exactly what broke the first Render deploy.)
      - name: Install
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # The harness applies the migrations itself before the first test file.
      - name: Test
        working-directory: backend
        run: npm test

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      # `npm run build` type-checks and then builds, so this catches a bundle
      # that cannot be produced before Vercel discovers the same thing.
      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API (Render)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Mapped to env first: the secrets context is not reliably readable from a
    # step-level `if`, but env is.
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      # Render exposes a deploy hook per service: Settings -> Deploy Hook. It is
      # a secret URL, so it lives in repository secrets, never in this file.
      # Turn Render's own "Auto-Deploy" OFF, or the service deploys twice and
      # the ungated one wins the race.
      # Checked before curl runs, because curl's own complaint about a bad value
      # is "URL rejected: Malformed input to a URL function", which says nothing
      # about the cause. GitHub masks the value in logs, so a bad secret is
      # otherwise invisible - the shape check is the only feedback available.
      - name: Trigger Render deploy
        if: ${{ env.DEPLOY_HOOK != '' }}
        run: |
          case "$DEPLOY_HOOK" in
            https://api.render.com/deploy/*) ;;
            *)
              echo "::error::RENDER_DEPLOY_HOOK_URL is set but is not a Render deploy hook."
              echo "::error::The secret value must be ONLY the URL, starting https://api.render.com/deploy/"
              echo "::error::Common cause: the secret was pasted as 'RENDER_DEPLOY_HOOK_URL = https://...' instead of just the URL."
              exit 1
              ;;
          esac
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"

      - name: Skip notice
        if: ${{ env.DEPLOY_HOOK == '' }}
        run: echo "RENDER_DEPLOY_HOOK_URL is not set - skipping. Add it in Settings -> Secrets."
